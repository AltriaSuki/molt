name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MOLT_REQUIRE_SANDBOX_TESTS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install nats-server for the NATS conformance and end-to-end tests
        run: |
          go install github.com/nats-io/nats-server/v2@latest
          echo "MOLT_NATS_SERVER=$(go env GOPATH)/bin/nats-server" >> "$GITHUB_ENV"
      - name: Install Linux isolation backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Test runner namespace policy; production never changes host sysctls.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
