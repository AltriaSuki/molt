# Copy to molt.toml, set the --scratch paths below, and run `molt run`.
#
# `molt do` reads a config only when given one with --config; without it, it
# starts the agent services below with its own defaults (state and forks under
# ~/.cache/molt).

[kernel]
data_dir = ".molt"        # audit.jsonl, registry/, sockets, secrets
transport = "unix"        # "unix" for one host, "nats" for many
nats_url = "nats://127.0.0.1:4222"
fsync = true

# A candidate service: one an agent may replace, so it runs in the Linux
# sandbox (bubblewrap) with no network, no host files but its own program,
# its private state in <data_dir>/state/echo and only the capabilities in its
# requests. Molt does not start when the sandbox is unavailable. A service
# without `isolation` is "native": a trusted host process with your files and
# network, which only you can change (docs/services.md).
[[service]]
name = "echo"
tier = "mutable"
isolation = "sandbox"
exec = { command = "molt-echo" }   # `cargo install --path crates/molt` puts it on PATH
memory_mb = 256
max_restarts = 5

# The agent. Services start with a scrubbed environment: `pass_env` names the
# variables copied from molt's own, and `env = { NAME = "value" }` sets more.

# The model gateway, the only service that sees the API key.
[[service]]
name = "model"
tier = "protected"
exec = { command = "molt-gateway" }
provides = ["model.*"]
requests = [{ target = "topic:publish:progress", budget = { calls = 10000000 } }]
pass_env = [
  "OPENAI_API_KEY", "OPENAI_BASE_URL", "MOLT_PROVIDER", "MOLT_MODEL_ALIASES", "MOLT_OPENAI_MODELS",
  "ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL",
  "MOLT_MODEL", "MOLT_EFFORT", "MOLT_MAX_TOKENS",
  "MOLT_MODEL_TIMEOUT_S", "MOLT_MODEL_RETRIES", "MOLT_MODEL_CONCURRENCY", "MOLT_FALLBACKS",
  "MOLT_MODEL_PRICES", "MOLT_PRICES_FILE", "MOLT_MODELS_FILE", "MOLT_ENDPOINTS", "XDG_DATA_HOME",
]

# Files and commands, confined to --root. Forks go to --scratch: replace
# /home/you/.cache/molt/work with a directory that is
# - absolute (nothing here expands ~),
# - private to you: it is created 0700, and a symlink, another user's directory
#   or one others can write to is refused, as they could swap a fork's files
#   before it is merged; so not a shared path like /tmp/molt-work,
# - outside the project and any repository or cargo workspace around it, or
#   tools run in a fork find the original's Cargo.toml and .git above them;
#   so not under data_dir while that is inside the project, as .molt is.
# It reports the files it changes outside forks on topic:fs.changed, which
# memory follows to keep its model of the project current.
[[service]]
name = "fs"
tier = "mutable"
exec = { command = "molt-tools", args = ["fs", "--root", ".", "--scratch", "/home/you/.cache/molt/work"] }
provides = ["fs.*"]
requests = [{ target = "topic:publish:fs.changed", budget = { calls = 100000000 } }]

# Commands run as you, unsandboxed, with a scrubbed environment; add what
# your builds and tests need with pass_env (`molt do --pass-env NAME` does the
# same for the default setup). MOLT_*, ANTHROPIC_* and OPENAI_* never reach them.
[[service]]
name = "shell"
tier = "protected"
exec = { command = "molt-tools", args = ["shell", "--root", ".", "--scratch", "/home/you/.cache/molt/work"] }
provides = ["shell.*"]
requests = [{ target = "topic:publish:progress", budget = { calls = 10000000 } }]
# Where the environment profiles find rustup and your Cargo cache.
pass_env = ["CARGO_HOME", "RUSTUP_HOME"]

# Memory: notes learned from finished runs, and a model of the project's code
# (definitions and references) the planner maps and searches. It reads runs
# back from the audit log and has the model learn from them. Remove this
# service to run without memory; the planner works without it.
[[service]]
name = "memory"
tier = "mutable"
exec = { command = "molt-memory", args = ["--root", ".", "--db", ".molt/memory.db", "--forks", "/home/you/.cache/molt/work"] }
provides = ["memory.*"]
pass_env = ["MOLT_MEMORY_MODEL", "MOLT_MEMORY_EFFORT", "MOLT_MEMORY_MAX_TOKENS", "MOLT_MEMORY_MODEL_TIMEOUT_S", "MOLT_PLANNER_MODEL", "MOLT_MODEL", "MOLT_ROLE_MODELS"]
requests = [
  { target = "model.complete", budget = { tokens = 1000000000, calls = 1000000 } },
  { target = "kernel.audit.read", budget = { calls = 10000000 } },
  { target = "topic:subscribe:fs.changed", budget = { calls = 10 } },
  { target = "fs.view", budget = { calls = 100000000 } },
]

# Web pages for the agent, from the hosts listed here only, over https and
# never from local or private addresses; commands still have no network. To
# use it, uncomment it and add `{ target = "web.fetch", budget = { calls =
# 1000000 } }` to the planner's requests below.
# [[service]]
# name = "web"
# tier = "protected"
# With fake-IP DNS, explicitly add "--resolver", "doh:https://1.1.1.1/dns-query"
# to the arguments. Only public page addresses are accepted; no HTTP proxy is used.
# exec = { command = "molt-web", args = ["--allow", "docs.rs", "--allow", "*.python.org"] }
# provides = ["web.*"]

# Calls 0 would refuse every call; ms 0 leaves deadlines to each request.
# Of memory, the planner may only ask: not remember, forget or learn.
[[service]]
name = "planner"
tier = "mutable"
exec = { command = "molt-planner" }
provides = ["planner.*"]
pass_env = [
  "MOLT_PLANNER_MODEL", "MOLT_MAX_TURNS", "MOLT_MAX_CHECK_ROUNDS", "MOLT_BUDGET_USD", "MOLT_EXPLORE",
  "MOLT_EXPLORE_MODEL", "MOLT_COMPACT", "MOLT_MAX_TOKENS", "MOLT_MODEL_TIMEOUT_S", "MOLT_CHECK_TIMEOUT_S", "MOLT_MAP_TOKENS", "MOLT_CONTEXT_TOKENS",
  "MOLT_INSTRUCTION_FILES", "MOLT_SYNTAX_CHECK",
  "MOLT_PROCESSES", "MOLT_GIT", "MOLT_ROLE_MODELS",
  # The adaptive schedule (docs/do.md#adaptive-schedule): MOLT_SCHEDULE=adaptive
  # starts one attempt and adds more on evidence; MOLT_ESCALATION_MODELS=haiku,sonnet,opus
  # is the models it escalates through, cheapest first; MOLT_MAX_ESCALATIONS caps it (2).
  "MOLT_SCHEDULE", "MOLT_ESCALATION_MODELS", "MOLT_MAX_ESCALATIONS",
]
requests = [
  { target = "model.complete", budget = { tokens = 4000000000, calls = 1000000 } },
  # fs.* covers fs.git, the history git reads with MOLT_GIT=on.
  { target = "fs.*", budget = { calls = 10000000 } },
  { target = "shell.run", budget = { calls = 1000000 } },
  { target = "topic:publish:progress", budget = { calls = 10000000 } },
  # Background processes (start_process and the rest), offered with MOLT_PROCESSES=on.
  { target = "shell.start", budget = { calls = 1000000 } },
  { target = "shell.read", budget = { calls = 1000000 } },
  { target = "shell.write", budget = { calls = 1000000 } },
  { target = "shell.stop", budget = { calls = 1000000 } },
  { target = "memory.index", budget = { calls = 10000000 } },
  { target = "memory.map", budget = { calls = 10000000 } },
  { target = "memory.recall", budget = { calls = 10000000 } },
  { target = "memory.symbols", budget = { calls = 10000000 } },
  { target = "memory.fork_symbols", budget = { calls = 10000000 } },
]

# Endpoints of your own, by name; a call names a model on one NAME/MODEL, as
# in --model glm/glm-4.6 or a role's model in [models.roles] below. protocol is
# "anthropic" (Messages compatible), "chat_completions" or "responses" (OpenAI);
# base_url has no /v1; key_env names the variable that holds the key, which
# only the gateway is given (auth: "x-api-key" by default for anthropic,
# "bearer" otherwise). Only the models declared are called there, with what
# they declare: tools, streaming, output_schema, efforts, max_output, and the
# optional context window and price in dollars per million tokens. The gateway
# gets them as MOLT_ENDPOINTS (JSON), which, when set in the environment, is
# used instead. `molt models show` lists them; `molt models probe glm/glm-4.6`
# checks one.
# [models.endpoints.glm]
# protocol = "anthropic"
# base_url = "https://open.bigmodel.cn/api/anthropic"
# key_env = "GLM_API_KEY"
#
# [models.endpoints.glm.models."glm-4.6"]
# tools = true
# streaming = true
# output_schema = false
# max_output = 32000
# context = 200000
# price = { input = 0.6, output = 2.2 }

# The model each role's calls go to when its declaration names none; the
# attempts keep the run's (--model). Roles: designer, vetter, reviewer, judge,
# router, explorer, compactor, memory. The planner and memory get it as
# MOLT_ROLE_MODELS, which, when set in the environment, is used instead.
# [models.roles]
# reviewer = "haiku"
# explorer = "haiku"
# memory = "haiku"

# The gate `molt improve run` promotes an improved planner prompt through
# (docs/improve.md); these are the defaults. Only your configuration sets
# them: the improver, a sandboxed candidate, reaches none of this, nor the
# tasks, their hidden tests or the held-out set. The prompt versions, the
# decisions and the promotions are kept in $MOLT_IMPROVE_DIR (default
# ~/.local/share/molt/improve; `none` makes `molt do` use none of them).
# [improve]
# max_regressions = 0     # tasks the candidate may pass less often than the live version
# min_gain = 1            # more runs, over both sets, it must pass
# min_heldout_gain = 0    # more runs of the held-out set it must pass
# max_cost_ratio = 1.5    # the most it may cost, as a multiple of the live version's
# trials = 1              # runs of each version on each task
# options = []            # `molt do` options of every run, such as ["--attempts", "1"]
# model = "sonnet"        # the improver's model; default: the gateway's

# When the interface's confirm mode stops for you; these are the defaults.
# [confirm]
# max_lines = 300
# max_files = 10
# ask_paths = [".github/", "Cargo.toml", "Cargo.lock", "package.json", "go.mod", "migrations/"]
# always_ask = false

# Environment profiles of your own, for the sandboxed shell: each adds one or
# replaces the built-in profile of its name (rust, python, python-venv, go,
# node); `detect = []` turns one off. `molt env doctor` runs their probes.
# [environment.node]
# detect = ["package.json"]
# tools = ["node", "npm", "npx"]
# read_only = ["/opt/corepack"]
# env = { NODE_OPTIONS = "--max-old-space-size=2048" }
# probes = [{ command = "npm ls --depth=0", fix = "run `npm install` in the project" }]

# The readiness check (`molt env doctor`, docs/sandbox.md): the project's own
# build, run in the sandbox once the environment is ready, and variables its
# commands need (only whether each is set and reaches them is checked). A
# project's .molt/config.toml may set `build` and `env` too. With
# `before_run`, `molt do` checks first and does not start when the
# environment is blocked, and the interface shows the result when it starts.
# [readiness]
# build = "cargo build --offline"
# env = ["DATABASE_URL"]
# before_run = true

# Dependency preparation (`molt env prepare`, docs/sandbox.md): the package
# index a hash-pinned requirements.txt is downloaded from, the other origins
# its files and redirects may come from, the packages that may be built from
# source (running their build scripts in the sandbox), and the download
# cache's quota. Only your user config sets it, never a project's.
# [prepare.python]
# index = "https://pypi.org/simple/"
# hosts = ["https://files.pythonhosted.org"]
# scripts = ["pyyaml"]
# max_mb = 2048
