title = "Parse temperatures, in a Python package whose pytest is only in .venv"
language = "python"
kind = "feature"
difficulty = "easy"
split = "dev"
tests = ".venv/bin/python -m pytest -q -p no:cacheprovider tests/test_convert.py"
check = ".venv/bin/python -m pytest -q -p no:cacheprovider tests/test_convert.py tests/test_bench_hidden.py"
prompt = """
Add `parse_temperature(text)` to `temps/convert.py`: it turns a temperature
written as a number followed by `C` or `F`, such as `"21.5C"`, `"-40F"` or
`"212F"`, into degrees Celsius as a float, so `"212F"` is `100.0` and
`"21.5C"` is `21.5`. The number may have a leading `-` and a decimal part;
there are no spaces, and the unit is an upper-case `C` or `F`. Anything
else, the empty string included, raises `ValueError` with the message
`bad temperature: ` followed by the text in quotes as `repr` gives it, such
as `bad temperature: '21K'`. Export it from the `temps` package as
`to_celsius` is, and add a pytest test of your own for it in
`tests/test_convert.py`.
"""

[smoke]
# pytest is installed only in the project's .venv, as in most Python projects.
setup = "python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest"
network = true
learn = true
verifier = "check"
