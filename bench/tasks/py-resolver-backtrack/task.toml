title = "Make the dependency resolver backtrack instead of giving up on solvable conflicts"
language = "python"
kind = "bugfix"
difficulty = "hard"
split = "dev"
tests = "python3 -m unittest -q tests.test_versions tests.test_index tests.test_lock tests.test_resolver tests.test_cli"
check = "python3 -m unittest -q tests.test_versions tests.test_index tests.test_lock tests.test_resolver tests.test_cli tests.test_bench_hidden"
timeout_s = 120
prompt = """
`resolve()` in `pkgresolve/resolver.py` gives up on requirement sets that do have a solution. It walks the requirements in the order it discovers them, gives each package the newest version allowed by whichever requirement asked for it first, and never revisits a choice. So the first diamond in a real index breaks it: in our staging mirror `auth 3.4.0` wants `jwt^3` while `jobs 3.x` only works with `jwt^2`, and instead of trying an older `auth` it raises `ResolutionError`. Even `resolve(index, ["tls>=1.0", "tls<1.3"])` fails when tls 1.3 exists, because it takes the newest tls for the first requirement and then trips over the second.

Please make `resolve(index, requirements)` find a resolution whenever one exists. The contract:

- `requirements` is a list of requirement strings, same syntax as in the index (`"b>=1.0,<2.0"`, `"web ^2.1"`, `"tls"`). Several of them may name the same package; all of them apply. An empty list resolves to `{}`. Malformed strings keep raising `InvalidRequirement` as they do now (the CLI relies on that).
- It returns a dict mapping package name to the chosen `Version` such that every chosen version exists in the index, every root requirement and every requirement of every chosen version is satisfied, and the dict holds exactly the packages reachable from the root requirements through the chosen versions: nothing left over from a version you tried and backed out of, nothing unrelated from the index. (`verify_lock(index, requirements, result)` returns `[]` for exactly such a dict.)
- A version whose requirements can't be met (it needs a package the index doesn't have, a version that doesn't exist, or something that clashes with other choices) is a dead end, so move on to the next candidate. The requirements of a version you backed out of no longer count for anything.
- Candidates are tried newest first, so when the newest versions work together you still get exactly those. Precisely: if one valid resolution picks, for every package in it, a version at least as new as the one any other valid resolution picks for that package (whenever the other one has that package at all), `resolve` must return that resolution, whatever the order of the root requirements. When valid resolutions trade off against each other (one has the newer `a`, another the newer `b`), any valid one is fine.
- Dependency cycles, including a version that requires its own package, are allowed and must terminate.
- If no valid resolution exists, including when the root asks for a package the index doesn't have, raise `ResolutionError` (already defined in `resolver.py`; keep it there and exported from `pkgresolve`). Its message must name at least one package involved in the conflict, for example `no version of jwt matches jwt>=3.0.0,<4.0.0 (from auth 3.4.0), jwt>=2.0.0,<3.0.0 (from jobs 3.4.0)`. The wording is up to you; when the root asks for a package the index doesn't have, name that package.
- It has to be fast on real indexes. `tests/data/mirror.json` is a snapshot of our staging mirror (30 packages, 15 versions each). Resolving `["app"]` against it fails today; once this is fixed it must take well under a second. Be warned that a quick backtracking patch someone tried last month handled the small diamonds but never finished on that snapshot: when a clash only shows up late, it kept retrying every combination of the unrelated choices made in between.

Please add tests for the new behaviour to `tests/test_resolver.py`. The suite runs with:

    python3 -m unittest -q tests.test_versions tests.test_index tests.test_lock tests.test_resolver tests.test_cli
"""
