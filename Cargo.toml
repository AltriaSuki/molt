[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/AltriaSuki/molt"

[workspace.dependencies]
molt-proto = { path = "crates/molt-proto" }
molt-transport = { path = "crates/molt-transport" }
molt-sdk = { path = "crates/molt-sdk" }
molt-kernel = { path = "crates/molt-kernel" }
molt-api = { path = "crates/molt-api" }
molt-gateway = { path = "crates/molt-gateway" }
molt-tools = { path = "crates/molt-tools" }
molt-planner = { path = "crates/molt-planner" }
molt-memory = { path = "crates/molt-memory" }
molt-bench = { path = "crates/molt-bench" }

anyhow = "1"
arc-swap = "1"
async-nats = "0.50"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
libc = "0.2"
rand = "0.9"
rayon = "1"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
